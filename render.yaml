# Free always-on demo while AWS can't create CloudFront. One web service serves the API (/api, /socket.io)
# and proxies every other path to Next in the same container, so cookies and sockets are same-origin.
# Free web services sleep after 15 min idle and take ~1 min to wake. Postgres is Neon (free): paste its
# *direct* (non-pooled) connection string as DATABASE_URL; Prisma migrations need a direct connection.
services:
  - type: web
    name: pulseboard
    runtime: docker
    plan: free
    region: singapore # same region as relayq-demo
    dockerfilePath: ./deploy/render/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      # Render allows one free Key Value per workspace and relayq-demo's `relayq-redis` holds it, so PulseBoard
      # shares it: paste relayq-redis's *internal* URL. Key spaces don't overlap (PulseBoard: ratelimit:,
      # presence:, board:, socket.io adapter channels; RelayQ: BullMQ bull:*).
      - key: REDIS_URL
        sync: false
      - key: API_BASE_PATH
        value: /api
      - key: TRUST_PROXY_HOPS
        value: "1" # Render's edge proxy
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: NEXT_PUBLIC_SOCKET_URL
        value: /
      # RelayQ board exports. RELAYQ_SERVICE_TOKEN must also be set as relayq-demo's PULSEBOARD_TOKEN;
      # RELAYQ_WEBHOOK_SECRET must equal relayq-demo's WEBHOOK_SECRET; RELAYQ_API_KEY is a tenant key from RelayQ.
      # AI on Amazon Bedrock (ask, triage, embeddings) with the pulseboard-render-bedrock IAM user
      # (infra PulseboardBedrock stack: those two models only). Paste its access key pair.
      - key: AWS_REGION
        value: ap-south-1
      - key: ASK_BEDROCK_MODEL
        value: zai.glm-5
      - key: EMBED_BEDROCK_MODEL
        value: amazon.titan-embed-text-v2:0
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RELAYQ_URL
        value: https://relayq-demo.onrender.com
      - key: RELAYQ_SERVICE_TOKEN
        generateValue: true
      - key: RELAYQ_API_KEY
        sync: false
      - key: RELAYQ_WEBHOOK_SECRET
        sync: false
