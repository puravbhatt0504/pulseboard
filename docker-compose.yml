# docker compose up  →  app at http://localhost:3000, API at http://localhost:4000
x-api-env: &api-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pulseboard
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: dev-access-secret-change-me
  JWT_REFRESH_SECRET: dev-refresh-secret-change-me
  WEB_ORIGIN: http://localhost:3000
  PUBLIC_API_URL: http://localhost:4000
  RELAYQ_URL: ${RELAYQ_URL:-http://host.docker.internal:3200} # RelayQ on this machine (its API port)
  RELAYQ_API_KEY: ${RELAYQ_API_KEY:-}
  RELAYQ_WEBHOOK_SECRET: ${RELAYQ_WEBHOOK_SECRET:-}
  RELAYQ_SERVICE_TOKEN: ${RELAYQ_SERVICE_TOKEN:-}

services:
  postgres:
    image: pgvector/pgvector:pg16 # Postgres 16 + pgvector (semantic search)
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: pulseboard }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 2s, retries: 30 }

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 30 }

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    environment: *api-env
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: pulseboard-api
    # Traces go to the Jaeger UI at http://localhost:16686. RelayQ on this machine joins the same trace with
    # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
    environment: { <<: *api-env, OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318", OTEL_SERVICE_NAME: pulseboard-api }
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      jaeger: { condition: service_started }

  jaeger:
    image: jaegertracing/all-in-one:1.62.0 # OTLP/HTTP on 4318, UI on 16686 (same image as RelayQ's compose)
    ports: ["16686:16686", "4318:4318"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: http://localhost:4000 }
    image: pulseboard-web
    ports: ["3000:3000"]
    depends_on: [api]

  # ETA model server: docker compose --profile ml up eta  →  http://localhost:8000 (RelayQ: MODEL_SUBSCRIBERS_ETA=http://localhost:8000/reload)
  # Reads the same host dir RelayQ's trainer writes to (RelayQ TRAINER_MODEL_DIR = <this repo>/ml/eta/models).
  eta:
    profiles: [ml]
    build: ml/eta
    image: pulseboard-ml-eta
    command: ["uvicorn", "eta.serve:app", "--host", "0.0.0.0"]
    environment:
      RELAYQ_URL: ${RELAYQ_URL:-http://host.docker.internal:3200}
      RELAYQ_API_KEY: ${RELAYQ_API_KEY:-}
      WEBHOOK_SECRET: ${RELAYQ_WEBHOOK_SECRET:-}
    volumes: ["./ml/eta/models:/models"]
    ports: ["8000:8000"]

volumes:
  pgdata:
