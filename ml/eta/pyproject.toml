[project]
name = "pulseboard-eta"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "xgboost-cpu>=2.1",  # no CUDA/NCCL libs
  "joblib>=1.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["eta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
