name: CI

on:
  push: { branches: [main] }
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulseboard
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access
  JWT_REFRESH_SECRET: ci-refresh

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16 # Postgres 16 + pgvector (semantic search)
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: pulseboard }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16 # Postgres 16 + pgvector (semantic search)
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: pulseboard }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e -w apps/web
        env:
          # Real Postgres + Redis service containers instead of the local embedded/mock server.
          E2E_API_COMMAND: npx prisma migrate deploy && npx tsx src/index.ts
          TRUST_PROXY_HOPS: "1" # see e2e-server.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/test-results }

  # Phase 11/12 gates: ask + triage evals on Bedrock (GLM 5, Titan) when AI code or eval data changes.
  # The role is created by PulseboardApp (pulseboard-ci-eval): Bedrock on those two models only.
  # Off with AWS (same switch as deploy): the role is gone after teardown. Run the evals locally then.
  eval-ask:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    env:
      AWS_REGION: ap-south-1
      ASK_BEDROCK_MODEL: zai.glm-5
      EMBED_BEDROCK_MODEL: amazon.titan-embed-text-v2:0
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: changed
        run: echo "ai=$(git diff --name-only ${{ github.event.pull_request.base.sha || github.event.before }} HEAD -- apps/api/src/ai apps/api/eval eval | head -1)" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.ai != ''
        uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "arn:aws:iam::934846852308:role/pulseboard-ci-eval", aws-region: ap-south-1 }
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.ai != ''
        with: { node-version: 20, cache: npm }
      - if: steps.changed.outputs.ai != ''
        run: npm ci && npm run eval:ask -w apps/api && npm run eval:triage -w apps/api

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t pulseboard-api .
      - run: docker build -f apps/web/Dockerfile -t pulseboard-web .
      - name: api image < 200 MB
        run: |
          size=$(docker image inspect pulseboard-api -f '{{.Size}}')
          echo "pulseboard-api: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((200 * 1024 * 1024))
      - name: api image boots and serves /health
        run: |
          docker compose up -d --wait postgres redis
          docker compose run --rm migrate
          docker compose up -d --wait api
          curl -fsS http://localhost:4000/health
          # Render image: one origin, pages proxied to Next, API under /api, real Postgres + Redis.
          docker build -f deploy/render/Dockerfile -t pulseboard-render .
          docker run -d --name render --network "$(basename "$PWD")_default" -p 10000:10000             -e PORT=10000 -e DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pulseboard             -e REDIS_URL=redis://redis:6379 -e JWT_ACCESS_SECRET=ci -e JWT_REFRESH_SECRET=ci pulseboard-render
          for i in $(seq 1 60); do curl -fsS http://localhost:10000/api/health && break; sleep 2; done
          curl -fsS http://localhost:10000/login | grep -q "Sign in"
          curl -fsS -X POST http://localhost:10000/api/auth/register -H "content-type: application/json"             -d '{"email":"ci@render.test","password":"password123"}' | grep -q '"email":"ci@render.test"'
          docker logs render | tail -20
          docker rm -f render
          docker compose down

  # Runs only once the PulseboardData stack exists and the repo variable AWS_DEPLOY_ROLE_ARN is set.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: [test, e2e, images]
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    env:
      AWS_REGION: ap-south-1
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE_ARN }}", aws-region: ap-south-1 }
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push images
        run: |
          REG=${{ steps.ecr.outputs.registry }}
          docker build -f apps/api/Dockerfile -t $REG/pulseboard-api:$TAG .
          docker build -f apps/api/Dockerfile --target migrate -t $REG/pulseboard-api:$TAG-migrate .
          docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=/api --build-arg NEXT_PUBLIC_SOCKET_URL=/ -t $REG/pulseboard-web:$TAG .
          docker build ml/eta -t $REG/pulseboard-api:$TAG-eta
          docker push $REG/pulseboard-api:$TAG
          docker push $REG/pulseboard-api:$TAG-migrate
          docker push $REG/pulseboard-web:$TAG
          docker push $REG/pulseboard-api:$TAG-eta
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # --exclusively: CI only rolls the stateless app stack; the data stack is changed by hand.
      - run: npx cdk deploy PulseboardApp --exclusively -c imageTag=$TAG --require-approval never --outputs-file outputs.json
        working-directory: infra
      - name: Smoke test /api/health
        working-directory: infra
        run: |
          URL=$(node -p "require('./outputs.json').PulseboardApp.Url")
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors "$URL/api/health"
